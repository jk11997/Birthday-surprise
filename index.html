<!DOCTYPE html>
<html>
    <head>
        <title>Birthday Surprise </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Dear Sister!</h1>

        <p>I have a surprise for you...❤️!</p>

        <button id="surpriseBtn">Click Here</button>
        <h2 id="message" style="display: none;">Happy Birthday, sister❤️!</h2>

        <button id="letterBtn">Open Your Letter✉️</button>
        <div id="letter" style="display: none;">
            <h2>A Letter For You</h2>
            <p>
                Dear Sister,

                You are very special for me!❤️
                I hope you achieve everything you dream about!
                Don't stress about future just enjoy your present! 

                Happy 18th Birthday My dear Sister!
                Keep smiling!

                With love❤️!
            </p>
        </div>
        <script src="script.js"></script>
    </body>
</html>
